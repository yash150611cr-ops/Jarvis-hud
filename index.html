<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S.</title>
  <style>
    body {
      margin: 0;
      background-color: #030914;
      color: #00f0ff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .orb-container {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 30px;
    }
    .orb {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #00f0ff 40%, #0051ff 80%, transparent 100%);
      box-shadow: 0 0 40px #00f0ff, 0 0 80px #0051ff;
      animation: pulse 2.5s infinite ease-in-out;
    }
    .ring {
      position: absolute;
      width: 200px;
      height: 200px;
      border: 2px dashed rgba(0, 240, 255, 0.5);
      border-radius: 50%;
      animation: spin 10s linear infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.95); opacity: 0.85; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 85%;
      max-width: 320px;
    }
    input {
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid #00f0ff;
      color: #fff;
      padding: 12px;
      border-radius: 6px;
      outline: none;
    }
    button {
      background: #00f0ff;
      color: #030914;
      border: none;
      padding: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 2px;
    }
    #status {
      margin-top: 15px;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="orb-container">
    <div class="ring"></div>
    <div class="orb" id="orb"></div>
  </div>
  <div class="controls">
    <input type="text" id="url" placeholder="LiveKit WebSocket URL (wss://...)">
    <input type="text" id="token" placeholder="LiveKit Room Token">
    <button id="initBtn">INITIALIZE JARVIS</button>
  </div>
  <div id="status">SYSTEM STANDBY</div>

  <script type="module">
    import { Room, RoomEvent } from 'https://esm.sh';

    window.onload = () => {
      document.getElementById('url').value = localStorage.getItem('lk_url') || '';
      document.getElementById('token').value = localStorage.getItem('lk_token') || '';
    };

    let room;
    document.getElementById('initBtn').onclick = async () => {
      const url = document.getElementById('url').value.trim();
      const token = document.getElementById('token').value.trim();
      const status = document.getElementById('status');

      if (!url || !token) {
        status.innerText = "ERROR: MISSING URL OR TOKEN";
        return;
      }

      localStorage.setItem('lk_url', url);
      localStorage.setItem('lk_token', token);

      try {
        status.innerText = "ESTABLISHING UPLINK...";
        room = new Room();
        
        room.on(RoomEvent.TrackSubscribed, (track) => {
          if (track.kind === 'audio') {
            const element = track.attach();
            document.body.appendChild(element);
          }
        });

        await room.connect(url, token);
        await room.localParticipant.setMicrophoneEnabled(true);
        status.innerText = "JARVIS ONLINE - LISTENING";
        document.getElementById('orb').style.animationDuration = "0.8s";
      } catch (e) {
        status.innerText = "CONNECTION FAILED: " + e.message;
      }
    };
  </script>
</body>
</html>
