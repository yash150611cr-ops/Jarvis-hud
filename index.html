<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S.</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    body {
      margin: 0;
      background-color: #030914;
      color: #00f0ff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .orb-container {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 45px;
    }

    .ring {
      position: absolute;
      width: 210px;
      height: 210px;
      border: 2px dashed rgba(0, 240, 255, 0.5);
      border-radius: 50%;
      animation: spin 16s linear infinite;
    }

    .orb {
      width: 155px;
      height: 155px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #00f0ff 40%, #0055ff 85%, transparent 100%);
      box-shadow: 0 0 35px #00f0ff, 0 0 70px rgba(0, 136, 255, 0.6);
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.95); opacity: 0.85; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    .controls {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    input {
      background: rgba(0, 240, 255, 0.05);
      border: 1.5px solid rgba(0, 240, 255, 0.6);
      border-radius: 8px;
      padding: 14px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }

    input::placeholder {
      color: rgba(0, 240, 255, 0.4);
    }

    button {
      background: #00f0ff;
      color: #030914;
      border: none;
      border-radius: 8px;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 2px;
      cursor: pointer;
      margin-top: 4px;
    }

    button:active {
      opacity: 0.8;
    }

    #status {
      text-align: center;
      margin-top: 12px;
      font-size: 13px;
      letter-spacing: 1.5px;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <div class="orb-container">
    <div class="ring"></div>
    <div class="orb" id="orb"></div>
  </div>

  <div class="controls">
    <input type="text" id="url" placeholder="LiveKit WebSocket URL (wss://...)">
    <input type="text" id="token" placeholder="LiveKit Room Token">
    <button id="initBtn">INITIALIZE JARVIS</button>
    <div id="status">SYSTEM STANDBY</div>
  </div>

  <script>
    window.onload = () => {
      const savedUrl = localStorage.getItem('lk_url');
      const savedToken = localStorage.getItem('lk_token');
      if (savedUrl) document.getElementById('url').value = savedUrl;
      if (savedToken) document.getElementById('token').value = savedToken;
    };

    let room;
    document.getElementById('initBtn').onclick = async () => {
      const url = document.getElementById('url').value.trim();
      const token = document.getElementById('token').value.trim();
      const status = document.getElementById('status');

      if (!url || !token) {
        status.innerText = "ERROR: MISSING URL OR TOKEN";
        return;
      }

      localStorage.setItem('lk_url', url);
      localStorage.setItem('lk_token', token);

      try {
        status.innerText = "ESTABLISHING UPLINK...";
        room = new LivekitClient.Room();

        room.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
          if (track.kind === 'audio') {
            const element = track.attach();
            document.body.appendChild(element);
          }
        });

        await room.connect(url, token);
        await room.localParticipant.setMicrophoneEnabled(true);
        status.innerText = "JARVIS ONLINE - LISTENING";
        document.getElementById('orb').style.animationDuration = "0.8s";
      } catch (e) {
        status.innerText = "CONNECTION FAILED: " + e.message;
      }
    };
  </script>
</body>
</html>
